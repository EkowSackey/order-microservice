server.port=8083
spring.application.name=order-service
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-local-only-do-not-use-in-production}
app.jwt.expiration-ms=86400000
customer-service.url=http://localhost:8081
restaurant-service.url=http://localhost:8082
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
app.internal.service-secret=${INTERNAL_SERVICE_SECRET:dev-internal-secret-local-only}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Feign circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j circuit breaker defaults
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.customer-service.base-config=default
resilience4j.circuitbreaker.instances.restaurant-service.base-config=default

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
